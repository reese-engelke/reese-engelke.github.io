<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Art | Reese Engelke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="site-nav">
    <a class="brand" href="index.html">Reese Engelke</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="fpga.html">FPGA</a>
        <a href="blender.html" aria-current="page">Blender</a>
    </div>
</nav>

<main class="wrap">
    <header class="page-intro">
        <h1>Blender art</h1>
        <p>Still frames and short loops. Click any piece to view it fullscreen.</p>
    </header>

    <section class="gallery">
        <figure class="gallery-card">
            <video autoplay loop muted playsinline onclick="openFullscreen(this)">
                <source src="assets/Marbleland.m4v" type="video/mp4">
            </video>
            <figcaption>
                <h3>Marble Land</h3>
                <p>Cycles</p>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <video autoplay loop muted playsinline onclick="openFullscreen(this)">
                <source src="assets/noodleshop.m4v" type="video/mp4">
            </video>
            <figcaption>
                <h3>Noodle Shop</h3>
                <p>Cycles</p>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <img src="assets/waterscape.jpg" alt="Waterscape with a chair and moonlit hills" onclick="openFullscreen(this)">
            <figcaption>
                <h3>Waterscape</h3>
                <p>Cycles</p>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <video autoplay loop muted playsinline onclick="openFullscreen(this)">
                <source src="assets/Flower.m4v" type="video/mp4">
            </video>
            <figcaption>
                <h3>Flower Shed</h3>
                <p>Cycles</p>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <img src="assets/lego_flowers.png" alt="Lego flower still life" onclick="openFullscreen(this)">
            <figcaption>
                <h3>Lego Flower</h3>
                <p>Cycles</p>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <img src="assets/darkwood.png" alt="Loft workspace with aquarium and dual monitors" onclick="openFullscreen(this)">
            <figcaption>
                <h3>Darkwood</h3>
                <p>Cycles</p>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <img src="assets/me_in_boat.png" alt="Figure in a small boat" onclick="openFullscreen(this)">
            <figcaption>
                <h3>Me In Boat</h3>
                <p>Octane</p>
            </figcaption>
        </figure>
    </section>
</main>

<footer class="site-footer">
    <div class="wrap">© Reese Engelke</div>
</footer>
<script src="script.js"></script>
</body>
</html>
